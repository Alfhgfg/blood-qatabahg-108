apply plugin: 'com.android.application'

android {
    namespace = "org.alnasr.bloodqatabah"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.alnasr.bloodqatabah"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def envVersionCode = System.getenv("ANDROID_VERSION_CODE")
        def envVersionName = System.getenv("ANDROID_VERSION_NAME")
        def parsedVersionCode = (envVersionCode != null && envVersionCode.trim().isInteger()) ? envVersionCode.trim().toInteger() : 1
        def resolvedVersionCode = parsedVersionCode > 0 ? parsedVersionCode : 1
        def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty()) ? envVersionName.trim() : "1.0"
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    def envKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
    def envStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def envKeyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: envStorePass
    File resolvedKeystoreFile = null
    if (envKeystorePath && envStorePass && envKeyAlias && envKeyPass) {
        def candidate = file(envKeystorePath)
        if (!candidate.exists()) {
            candidate = file("../" + envKeystorePath)
        }
        if (candidate.exists() && candidate.length() > 0) {
            resolvedKeystoreFile = candidate
        }
    }

    signingConfigs {
        release {
            if (resolvedKeystoreFile != null) {
                storeFile resolvedKeystoreFile
                storePassword envStorePass
                keyAlias envKeyAlias
                keyPassword envKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (resolvedKeystoreFile != null) {
                signingConfig signingConfigs.release
            } else {
                // When release signing key is not provided in environment secrets,
                // automatically fallback to signingConfigs.debug so the generated APK is signed
                // and directly installable on Android devices without "INSTALL_PARSE_FAILED_NO_CERTIFICATES"
                signingConfig signingConfigs.debug
            }
        }
    }
    lint {
        abortOnError false
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-common'
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
